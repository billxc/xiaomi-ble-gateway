# Generic fresh-install example. Check your board and ESPHome documentation.
# Do not use this as an OTA partition/bootloader migration recipe.
esphome:
  name: ble-proxy
  min_version: 2026.10.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
